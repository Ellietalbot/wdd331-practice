<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backdrop Filter Performance Demo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

/* ====================================
   VERSION 1: FROSTED GLASS HEADER
   ==================================== */
/* header {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: 150px;  
    padding: 1rem 2rem;

    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(50px);
    -webkit-backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(255,255,255,0.4);
} */

/* ====================================
   VERSION 2: SOLID HEADER
   Uncomment for comparison
   ==================================== */

header {
    position: sticky;
    top: 0;
    z-index: 1000;

    padding: 1rem 2rem;

    background: white;
    border-bottom: 1px solid #ddd;
}


header h1 {
    margin-bottom: 0.5rem;
}

header p {
    color: #444;
}

.grid {
    padding: 2rem;

    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
}

.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
}

.card p {
    padding: 1rem;
}

.go-back {
    display: inline-block;
    padding: 1rem 2rem 0;
    color: oklch(0.6357 0.2286 354.89);
    font-weight: 600;
    text-decoration: none;
    font-size: 1.5rem;
}

.go-back:hover {
    text-decoration: underline;
}

.site-footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-top: 2rem;
    padding: 1.5rem 2rem;
    border-top: 1.5px solid #e2e8f0;
    color: #64748b;
    font-size: 1.2rem;
}

.site-footer p {
    margin: 0;
}

.site-footer ul {
    display: flex;
    gap: 1rem;
    list-style: none;
    padding: 0;
    margin: 0;
}

.site-footer a {
    color: #64748b;
}

.site-footer a:hover {
    color: oklch(0.6357 0.2286 354.89);
}
</style>
</head>
<body>

<a class="go-back" href="../../index.html">&larr; Home</a>

<header>
    <h1>Backdrop Filter Performance Demo</h1>
    <p>Scroll while recording DevTools Performance.</p>
</header>

<div class="grid" id="grid"></div>

<footer class="site-footer">
    <p>&copy; 2026 Ellie Talbot. Built for WDD 331R Advanced CSS.</p>
    <ul>
        <li><a href="https://github.com/Ellietalbot/wdd331-practice">Source on GitHub</a></li>
    </ul>
</footer>

<script>
const grid = document.getElementById("grid");

for (let i = 1; i <= 400; i++) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <img src="https://picsum.photos/600/400?random=${i}" alt="Random image">
        <p>Image Card ${i}</p>
    `;

    grid.appendChild(card);
}
</script>

</body>
</html>
